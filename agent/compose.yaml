# Нативная Ollama на хосте: рекомендуемый вариант для Apple Silicon/Metal.
services:
  agent:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: 8000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      TRANSPORT_BASE_URL: ${TRANSPORT_BASE_URL:-http://host.docker.internal:8080}
    ports:
      - "${AGENT_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 10s
